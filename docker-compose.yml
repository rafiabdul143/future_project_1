version: '3.8'

services:
  # Infrastructure Services
  mongodb:
    image: mongo:7.0
    container_name: foodie-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: foodie_express
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - foodie-network

  redis:
    image: redis:7.2-alpine
    container_name: foodie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - foodie-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: foodie-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - foodie-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: foodie-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - foodie-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: foodie-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - foodie-network

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: foodie-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=your-super-secret-jwt-key-here
      - REDIS_URL=redis://redis:6379
      - USER_SERVICE_URL=http://user-service:3001
      - RESTAURANT_SERVICE_URL=http://restaurant-service:3002
      - MENU_SERVICE_URL=http://menu-service:3003
      - ORDER_SERVICE_URL=http://order-service:3004
      - PAYMENT_SERVICE_URL=http://payment-service:3005
      - DELIVERY_SERVICE_URL=http://delivery-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:3007
      - REVIEW_SERVICE_URL=http://review-service:3008
      - SEARCH_SERVICE_URL=http://search-service:3009
    depends_on:
      - redis
      - user-service
      - restaurant-service
      - menu-service
      - order-service
      - payment-service
      - delivery-service
      - notification-service
      - review-service
      - search-service
    networks:
      - foodie-network

  # Microservices
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: foodie-user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/user_service?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key-here
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key-here
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - foodie-network

  restaurant-service:
    build:
      context: ./services/restaurant-service
      dockerfile: Dockerfile
    container_name: foodie-restaurant-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/restaurant_service?authSource=admin
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - GOOGLE_MAPS_API_KEY=your-google-maps-api-key
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - foodie-network

  menu-service:
    build:
      context: ./services/menu-service
      dockerfile: Dockerfile
    container_name: foodie-menu-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/menu_service?authSource=admin
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - AWS_S3_BUCKET=foodie-express-images
      - AWS_ACCESS_KEY_ID=your-aws-access-key
      - AWS_SECRET_ACCESS_KEY=your-aws-secret-key
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - foodie-network

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: foodie-order-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/order_service?authSource=admin
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - foodie-network

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: foodie-payment-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/payment_service?authSource=admin
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - STRIPE_SECRET_KEY=your-stripe-secret-key
      - STRIPE_WEBHOOK_SECRET=your-stripe-webhook-secret
      - PAYPAL_CLIENT_ID=your-paypal-client-id
      - PAYPAL_CLIENT_SECRET=your-paypal-client-secret
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - foodie-network

  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile
    container_name: foodie-delivery-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/delivery_service?authSource=admin
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - GOOGLE_MAPS_API_KEY=your-google-maps-api-key
      - SOCKET_IO_PORT=3016
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - foodie-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: foodie-notification-service
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=development
      - PORT=3007
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/notification_service?authSource=admin
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - FIREBASE_PROJECT_ID=your-firebase-project-id
      - FIREBASE_PRIVATE_KEY=your-firebase-private-key
      - FIREBASE_CLIENT_EMAIL=your-firebase-client-email
      - TWILIO_ACCOUNT_SID=your-twilio-account-sid
      - TWILIO_AUTH_TOKEN=your-twilio-auth-token
      - SENDGRID_API_KEY=your-sendgrid-api-key
      - SOCKET_IO_PORT=3017
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - foodie-network

  review-service:
    build:
      context: ./services/review-service
      dockerfile: Dockerfile
    container_name: foodie-review-service
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=development
      - PORT=3008
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/review_service?authSource=admin
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - foodie-network

  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: foodie-search-service
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=development
      - PORT=3009
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/search_service?authSource=admin
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongodb
      - elasticsearch
      - redis
      - kafka
    networks:
      - foodie-network

  # Frontend Applications
  customer-app:
    build:
      context: ./frontend/customer-app
      dockerfile: Dockerfile
    container_name: foodie-customer-app
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
      - REACT_APP_SOCKET_URL=http://localhost:3000
      - REACT_APP_GOOGLE_MAPS_API_KEY=your-google-maps-api-key
      - REACT_APP_STRIPE_PUBLISHABLE_KEY=your-stripe-publishable-key
      - REACT_APP_FIREBASE_CONFIG=your-firebase-config-json
    depends_on:
      - api-gateway
    networks:
      - foodie-network

  restaurant-portal:
    build:
      context: ./frontend/restaurant-portal
      dockerfile: Dockerfile
    container_name: foodie-restaurant-portal
    restart: unless-stopped
    ports:
      - "3011:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
      - REACT_APP_SOCKET_URL=http://localhost:3000
      - REACT_APP_GOOGLE_MAPS_API_KEY=your-google-maps-api-key
    depends_on:
      - api-gateway
    networks:
      - foodie-network

  driver-app:
    build:
      context: ./frontend/driver-app
      dockerfile: Dockerfile
    container_name: foodie-driver-app
    restart: unless-stopped
    ports:
      - "3012:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
      - REACT_APP_SOCKET_URL=http://localhost:3000
      - REACT_APP_GOOGLE_MAPS_API_KEY=your-google-maps-api-key
    depends_on:
      - api-gateway
    networks:
      - foodie-network

  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
      dockerfile: Dockerfile
    container_name: foodie-admin-dashboard
    restart: unless-stopped
    ports:
      - "3013:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
      - REACT_APP_SOCKET_URL=http://localhost:3000
    depends_on:
      - api-gateway
    networks:
      - foodie-network

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: foodie-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - foodie-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: foodie-grafana
    restart: unless-stopped
    ports:
      - "3014:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - foodie-network

  nginx:
    image: nginx:1.25-alpine
    container_name: foodie-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api-gateway
      - customer-app
      - restaurant-portal
      - driver-app
      - admin-dashboard
    networks:
      - foodie-network

volumes:
  mongodb_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

networks:
  foodie-network:
    driver: bridge
